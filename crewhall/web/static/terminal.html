<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>crewhall — terminal</title>
<link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
<link rel="stylesheet" href="/static/terminal.css">
</head>
<body>
<header class="tbar">
  <span class="tbadge" id="term-host-badge">local</span>
  <span class="tconn" id="term-conn-state">connecting…</span>
  <span class="spacer"></span>
  <input id="term-search" class="tsearch" placeholder="Find in scrollback…  (Ctrl+F)" autocomplete="off" spellcheck="false">
  <button class="tbtn" id="term-search-next">Next</button>
  <button class="tbtn" id="term-claim" title="Take the keyboard">Take keyboard</button>
  <button class="tbtn" id="term-close">Close</button>
</header>
<main id="xterm" aria-label="terminal"></main>
<script src="/static/vendor/xterm/xterm.js"></script>
<script src="/static/vendor/xterm/addon-fit.js"></script>
<script src="/static/vendor/xterm/addon-search.js"></script>
<script src="/static/js/terminal_page.js"></script>
</body>
</html>
