name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"   # nightly: also runs the real-agent tests when configured

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check crewhall tests scripts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install mypy
      # Non-strict for the package; strict for messaging/team/requests/
      # persistence/harness (see [tool.mypy] in pyproject.toml).
      - run: mypy

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pip install coverage
      # The suite spawns the daemon and the CLI as subprocesses; the .pth makes
      # every Python process start coverage so their lines are measured too.
      - name: Enable subprocess coverage
        run: |
          python - <<'PY'
          import pathlib, site
          pth = pathlib.Path(site.getsitepackages()[0]) / "zz_coverage.pth"
          pth.write_text("import coverage; coverage.process_startup()\n")
          PY
      - run: COVERAGE_PROCESS_START=$PWD/pyproject.toml coverage run -m unittest discover
      - run: coverage combine
      # Fails below 80% global, 90% on messaging/conversations and 90% on
      # daemon._guard_origin / controller.publish_artifact.
      - run: python scripts/coverage_gate.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y tmux
      # The suite uses its own tmux socket (tests/__init__.py): it never touches
      # a developer's live agents.
      - run: python -m unittest discover

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the scan also walks the git history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/privacy_scan.py

  real-agents:
    # Needs the real CLIs and credentials; runs only on the nightly schedule and
    # only when a runner with them is configured.
    if: github.event_name == 'schedule' && vars.REAL_AGENT_RUNNER != ''
    runs-on: ${{ vars.REAL_AGENT_RUNNER }}
    steps:
      - uses: actions/checkout@v7
      - run: AT_RUN_CLAUDE=1 AT_RUN_OPENCODE=1 AT_RUN_CODEX=1 python -m unittest discover
      # Fase F1: the end-to-end smoke with real agents (two OpenCode agents,
      # human draft, queue across a restart, denied control plane, chat publish).
      - run: python scripts/smoke.py --require

  browser:
    # Optional: drives a real Chromium through Playwright. The tests skip when
    # Playwright is absent, so this only runs when explicitly requested (a
    # nightly run, or the `browser-tests` label on a PR).
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'browser-tests')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python -m unittest tests.test_web_ui_browser tests.test_terminal_web_browser
